# ============================================================================
#  K-OBD-PI AUTOMOTIVE - Master Runtime Configuration
#  Loaded by: src/core/main.c, telemetry_engine.c, web_server.c
#  Default path: /etc/kobd/obd.conf
#  Syntax: '#' or ';' comments, [section] blocks, 'key = value' pairs.
# ============================================================================

# ---------------------------------------------------------------------------
[core]
# Run as a background daemon (double-fork + PID file)
daemonize = false
pid_file = /var/run/kobd.pid

# Execute the power-on self-test suite
run_selftest = true

# Logging verbosity: 1=ERROR 2=WARN 3=INFO 4=DEBUG 5=TRACE
log_level = 3
use_syslog = false

# Load a demo security token into the CSM at boot
secure_boot = false

# ---------------------------------------------------------------------------
[can]
interface = can0
bitrate = 500000

# Standard OBD-II engine ECU addressing (Mode 01 polling)
target_id = 0x7E0
reply_id = 0x7E8

# ---------------------------------------------------------------------------
[telemetry]
# Polling cycle in milliseconds (50 Hz default)
cycle_ms = 20

# ---------------------------------------------------------------------------
[web]
# HTTP + WebSocket console port
port = 80

# ---------------------------------------------------------------------------
[mqtt]
# Live telemetry streaming to an MQTT 3.1.1 broker
enabled = false
host = 127.0.0.1
port = 1883
client_id = kobd-pi
topic = kobd/telemetry
publish_ms = 1000

# ---------------------------------------------------------------------------
[trip]
# Trip CSV log path and idle-stop termination threshold (seconds)
csv_path = /var/log/kobd/trips.csv
end_after_idle_s = 120

# ---------------------------------------------------------------------------
[csv]
# Periodic telemetry snapshot path (1 Hz append)
path = /var/log/kobd/snapshot.csv

# ---------------------------------------------------------------------------
[recorder]
# Raw CAN frame capture to a binary recorder log
enabled = false
path = /var/log/kobd/capture.bin

# ---------------------------------------------------------------------------
[dbc]
# Optional Vector DBC database for signal-level decoding (empty = disabled)
path =

# ---------------------------------------------------------------------------
[diag]
# WWH-OBD (ISO 27145) VIN acquisition through the diagnostic session
wwh_vin = true
# J1939 extended-frame parsing for 29-bit traffic
j1939 = true

# Periodically enumerate ECUs over the ISO-TP network (scan engine thread)
global_scan = true

# Activate the DoIP physical addressing route when the gateway starts
doip_activate = false

# Allow write-access diagnostic operations (security/variant/immo/reset/DTC)
# through the REST API. Default-deny: keep off unless explicitly enabled.
web_access = false

# ---------------------------------------------------------------------------
[doip]
# ISO 13400-2 Ethernet gateway to a remote diagnostic tester
enabled = false
host =
port = 13400
source_addr = 0x0E00

# ---------------------------------------------------------------------------
[remote_bridge]
# Downlink bridge to a remote SocketCAN endpoint
host =
port = 5555

# ---------------------------------------------------------------------------
[remote_vci]
# Virtual VCI server exposing the local CAN RX stream to one TCP client
enabled = false
port = 7000

# ---------------------------------------------------------------------------
[j2534]
# SAE J2534-1 Pass-Thru API over TCP (raw frame protocol, see j2534.h)
enabled = false
port = 6801

# ---------------------------------------------------------------------------
[can]
# CAN-FD mode (ISO 11898-1 / ISO 15765-2 with FD frames)
fd_mode = false

