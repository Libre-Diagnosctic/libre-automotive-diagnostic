name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    # Protocol-layer tests — no hardware, run everywhere.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests/test_protocol_unit.py -v

  integration-socketcan:
    # Keystone: real SocketCAN + kernel ISO-TP against the virtual ECU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-socketcan.txt
      - name: Bring up virtual CAN
        run: |
          sudo modprobe vcan
          sudo modprobe can_isotp
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Run full test suite (incl. vcan integration)
        run: python -m pytest tests/ -v
